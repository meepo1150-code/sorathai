name: Apply Search Console verification

on:
  push:
    branches: [agent/search-console-verification]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/search-console-verification
      - name: Insert verification meta tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '    <meta name="google-site-verification" content="CbFmlBI9Nf7M5h15AKI0hVoA3M2GHpeR3VWWsH4EsCs" />\n'
          if 'name="google-site-verification"' not in s:
              marker = '    <meta charset="utf-8" />\n'
              if marker not in s:
                  raise SystemExit('head marker not found')
              s = s.replace(marker, marker + tag, 1)
              p.write_text(s)
          PY
      - name: Commit verification tag
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "chore: verify site ownership with Google"
          git push origin HEAD:agent/search-console-verification
