name: Apply final dream export label fix

on:
  push:
    branches:
      - agent/launch-readiness

permissions:
  contents: write

jobs:
  fix-label:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out launch branch
        uses: actions/checkout@v4
        with:
          ref: agent/launch-readiness
          fetch-depth: 0

      - name: Normalize Dream PNG export label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dream-result.html')
          source = path.read_text(encoding='utf-8')
          old = '</svg>แชร์</button>'
          new = '</svg>บันทึกการ์ด</button>'
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          PY

      - name: Commit label fix when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Dream export label already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dream-result.html
          git commit -m "fix: label dream image export accurately"
          git push origin HEAD:agent/launch-readiness
