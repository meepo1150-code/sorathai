name: Validate static website

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Generate npm lockfile candidate
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Emit npm lockfile candidate
        run: |
          echo "LOCKFILE_CANDIDATE_BEGIN"
          base64 -w0 package-lock.json
          echo
          echo "LOCKFILE_CANDIDATE_END"

      - name: Validate HTML links, metadata, and sitemap
        run: python scripts/validate_site.py

      - name: Validate external dependency boundary
        run: python scripts/validate_external_dependencies.py

      - name: Validate response header source contract
        run: python scripts/validate_headers.py

      - name: Validate GitHub Action pins
        run: python scripts/validate_action_pins.py

      - name: Check production smoke script syntax
        run: bash -n scripts/production_smoke.sh

      - name: Test shared profile and reading models
        run: node --test tests/*.test.js

      - name: Review generated reading content
        run: node scripts/review_readings.js

      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:e2e

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check whitespace errors
        run: git diff --check
